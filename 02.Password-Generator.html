<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>* { font-family: 'Oswald', sans-serif; }</style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-6">

  <div class="w-full max-w-5xl">
    <a href="index.html" class="inline-flex items-center gap-1 text-gray-400 hover:text-blue-500 text-sm transition-colors">
      <i class='bx bx-arrow-back'></i> Back to Index
    </a>
  </div>

  <div class="w-full max-w-5xl">
    <h1 class="text-4xl font-bold text-gray-800">Password Generator</h1>
    <p class="text-gray-400 font-light mt-1">Generate secure passwords and PINs with custom options</p>
  </div>

  <!-- Password Section — Bento 3-col -->
  <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-5">

    <!-- Options -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-4">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-slider text-blue-500'></i> Options</h2>
      <div class="flex flex-col gap-1">
        <label class="text-sm text-gray-500">Length: <span id="lengthValue" class="font-semibold text-gray-800">12</span></label>
        <input type="range" id="length" min="4" max="32" value="12" class="w-full accent-blue-500" />
      </div>
      <div class="grid grid-cols-2 gap-2 text-sm">
        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="uppercase" checked class="accent-blue-500 w-4 h-4" /> Uppercase</label>
        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="lowercase" checked class="accent-blue-500 w-4 h-4" /> Lowercase</label>
        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="numbers"   checked class="accent-blue-500 w-4 h-4" /> Numbers</label>
        <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="symbols"   checked class="accent-blue-500 w-4 h-4" /> Symbols</label>
      </div>
    </div>

    <!-- Output -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-4">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-key text-blue-500'></i> Password</h2>
      <input type="text" id="passwordDisplay" readonly placeholder="Click Generate"
        class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-mono text-sm focus:outline-none tracking-widest" />
      <div class="w-full h-2 bg-gray-200 rounded-full">
        <div id="strengthBar" class="h-full w-0 rounded-full transition-all duration-300"></div>
      </div>
      <p id="strengthText" class="text-sm text-gray-500">Strength: <span class="font-semibold">—</span></p>
    </div>

    <!-- Actions -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-3 justify-center">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-bolt-circle text-blue-500'></i> Actions</h2>
      <button id="generateBtn" class="w-full bg-blue-500 text-white font-semibold py-2 rounded-xl hover:bg-blue-600 transition-colors flex items-center justify-center gap-2">
        <i class='bx bx-refresh'></i> Generate
      </button>
      <button id="copyBtn" class="w-full bg-green-500 text-white font-semibold py-2 rounded-xl hover:bg-green-600 transition-colors flex items-center justify-center gap-2">
        <i class='bx bx-copy'></i> Copy
      </button>
      <button id="clearBtn" class="w-full bg-gray-200 text-gray-700 font-semibold py-2 rounded-xl hover:bg-gray-300 transition-colors flex items-center justify-center gap-2">
        <i class='bx bx-x'></i> Clear
      </button>
      <p id="copyMsg" class="hidden text-green-600 text-sm text-center">Copied!</p>
    </div>

  </div>

  <!-- PIN Section — Bento 2-col -->
  <div class="w-full max-w-5xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">PIN Generator</h2>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

      <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-4">
        <h3 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-slider text-purple-500'></i> Options</h3>
        <div class="flex flex-col gap-1">
          <label class="text-sm text-gray-500">Length: <span id="pinLengthValue" class="font-semibold text-gray-800">4</span></label>
          <input type="range" id="pinLength" min="3" max="12" value="4" class="w-full accent-purple-500" />
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-4">
        <h3 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-hash text-purple-500'></i> PIN</h3>
        <input type="text" id="pinDisplay" readonly placeholder="Click Generate PIN"
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl font-mono text-sm focus:outline-none tracking-widest" />
      </div>

      <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-3 justify-center">
        <h3 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-bolt-circle text-purple-500'></i> Actions</h3>
        <button id="generatePinBtn" class="w-full bg-purple-500 text-white font-semibold py-2 rounded-xl hover:bg-purple-600 transition-colors flex items-center justify-center gap-2">
          <i class='bx bx-refresh'></i> Generate PIN
        </button>
        <button id="clearPinBtn" class="w-full bg-gray-200 text-gray-700 font-semibold py-2 rounded-xl hover:bg-gray-300 transition-colors flex items-center justify-center gap-2">
          <i class='bx bx-x'></i> Clear
        </button>
      </div>

    </div>
  </div>

  <script>
    var upperCaseLetters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    var lowerCaseLetters = "abcdefghijklmnopqrstuvwxyz";
    var numbers  = "0123456789";
    var symbols  = "!@#$%^&*()_+[]{}|;:,.<>?";

    var lengthInput       = document.getElementById("length");
    var uppercaseCheckbox = document.getElementById("uppercase");
    var lowercaseCheckbox = document.getElementById("lowercase");
    var numbersCheckbox   = document.getElementById("numbers");
    var symbolsCheckbox   = document.getElementById("symbols");
    var passwordDisplay   = document.getElementById("passwordDisplay");
    var pinLengthInput    = document.getElementById("pinLength");
    var pinDisplay        = document.getElementById("pinDisplay");

    document.getElementById("lengthValue").textContent = lengthInput.value;
    document.getElementById("pinLengthValue").textContent = pinLengthInput.value;

    lengthInput.addEventListener("input", function() { document.getElementById("lengthValue").textContent = lengthInput.value; });
    pinLengthInput.addEventListener("input", function() { document.getElementById("pinLengthValue").textContent = pinLengthInput.value; });

    function generatePassword() {
      var len = parseInt(lengthInput.value);
      var chars = "";
      var password = "";

      if (uppercaseCheckbox.checked) { chars += upperCaseLetters; }
      if (lowercaseCheckbox.checked) { chars += lowerCaseLetters; }
      if (numbersCheckbox.checked)   { chars += numbers; }
      if (symbolsCheckbox.checked)   { chars += symbols; }

      if (chars === "") { alert("Select at least one character type!"); return; }

      for (var i = 0; i < len; i++) {
        password += chars[Math.floor(Math.random() * chars.length)];
      }
      passwordDisplay.value = password;
      checkStrength(password);
    }

    function checkStrength(password) {
      var hasUpper  = /[A-Z]/.test(password);
      var hasLower  = /[a-z]/.test(password);
      var hasNumber = /[0-9]/.test(password);
      var hasSymbol = /[!@#$%^&*()_+\[\]{}|;:,.<>?]/.test(password);
      var count = 0;
      if (hasUpper)  { count++; }
      if (hasLower)  { count++; }
      if (hasNumber) { count++; }
      if (hasSymbol) { count++; }

      var bar  = document.getElementById("strengthBar");
      var text = document.getElementById("strengthText");

      if (password.length >= 12 && count >= 3) {
        bar.style.width = "100%"; bar.style.backgroundColor = "#22c55e";
        text.innerHTML = 'Strength: <span class="font-semibold text-green-500">Strong</span>';
      } else if (password.length >= 8 && count >= 2) {
        bar.style.width = "60%"; bar.style.backgroundColor = "#eab308";
        text.innerHTML = 'Strength: <span class="font-semibold text-yellow-500">Medium</span>';
      } else {
        bar.style.width = "30%"; bar.style.backgroundColor = "#ef4444";
        text.innerHTML = 'Strength: <span class="font-semibold text-red-500">Weak</span>';
      }
    }

    document.getElementById("generateBtn").addEventListener("click", generatePassword);

    document.getElementById("copyBtn").addEventListener("click", function() {
      if (passwordDisplay.value === "") { return; }
      passwordDisplay.select();
      document.execCommand("copy");
      var msg = document.getElementById("copyMsg");
      msg.classList.remove("hidden");
      setTimeout(function() { msg.classList.add("hidden"); }, 2000);
    });

    document.getElementById("clearBtn").addEventListener("click", function() {
      passwordDisplay.value = "";
      document.getElementById("strengthBar").style.width = "0";
      document.getElementById("strengthText").innerHTML = 'Strength: <span class="font-semibold">—</span>';
    });

    document.getElementById("generatePinBtn").addEventListener("click", function() {
      var len = parseInt(pinLengthInput.value);
      var pin = "";
      for (var i = 0; i < len; i++) { pin += Math.floor(Math.random() * 10); }
      pinDisplay.value = pin;
    });

    document.getElementById("clearPinBtn").addEventListener("click", function() { pinDisplay.value = ""; });
  </script>

</body>
</html>
