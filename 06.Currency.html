<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>* { font-family: 'Oswald', sans-serif; }</style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-6">

  <div class="w-full max-w-5xl">
    <a href="index.html" class="inline-flex items-center gap-1 text-gray-400 hover:text-blue-500 text-sm transition-colors">
      <i class='bx bx-arrow-back'></i> Back to Index
    </a>
  </div>

  <div class="w-full max-w-5xl">
    <h1 class="text-4xl font-bold text-gray-800">Currency Converter</h1>
    <p class="text-gray-400 font-light mt-1">Live exchange rates powered by ExchangeRate-API</p>
  </div>

  <!-- Bento: converter center, quick rates side -->
  <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-5">

    <!-- Quick rates left -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-3">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-trending-up text-yellow-500'></i> Quick Rates</h2>
      <p class="text-xs text-gray-400 font-light">Click to load into converter</p>
      <div class="flex flex-col gap-2" id="quickRates">
        <button onclick="setQuick('USD','PHP')" class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2 hover:bg-blue-50 transition text-sm">
          <span class="text-gray-600">USD → PHP</span><i class='bx bx-right-arrow-alt text-blue-400'></i>
        </button>
        <button onclick="setQuick('USD','EUR')" class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2 hover:bg-blue-50 transition text-sm">
          <span class="text-gray-600">USD → EUR</span><i class='bx bx-right-arrow-alt text-blue-400'></i>
        </button>
        <button onclick="setQuick('USD','JPY')" class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2 hover:bg-blue-50 transition text-sm">
          <span class="text-gray-600">USD → JPY</span><i class='bx bx-right-arrow-alt text-blue-400'></i>
        </button>
        <button onclick="setQuick('EUR','GBP')" class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2 hover:bg-blue-50 transition text-sm">
          <span class="text-gray-600">EUR → GBP</span><i class='bx bx-right-arrow-alt text-blue-400'></i>
        </button>
        <button onclick="setQuick('PHP','USD')" class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2 hover:bg-blue-50 transition text-sm">
          <span class="text-gray-600">PHP → USD</span><i class='bx bx-right-arrow-alt text-blue-400'></i>
        </button>
        <button onclick="setQuick('USD','KRW')" class="flex justify-between items-center bg-gray-50 rounded-xl px-3 py-2 hover:bg-blue-50 transition text-sm">
          <span class="text-gray-600">USD → KRW</span><i class='bx bx-right-arrow-alt text-blue-400'></i>
        </button>
      </div>
    </div>

    <!-- Converter center — spans 2 cols -->
    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-6 flex flex-col gap-5">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-dollar-circle text-yellow-500'></i> Converter</h2>

      <!-- Amount -->
      <div class="flex flex-col gap-1">
        <label class="text-sm text-gray-500">Amount</label>
        <input type="text" id="amountInput" value="1"
          class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-lg focus:outline-none focus:ring-2 focus:ring-blue-400" />
      </div>

      <!-- From / Swap / To -->
      <div class="grid grid-cols-5 gap-3 items-end">
        <div class="col-span-2 flex flex-col gap-1">
          <label class="text-sm text-gray-500">From</label>
          <div class="from flex items-center bg-gray-50 border border-gray-200 rounded-xl px-3 h-11 gap-2">
            <img id="fromFlag" src="https://flagcdn.com/48x36/us.png" class="w-5 h-4 object-cover rounded-sm" />
            <select class="bg-transparent outline-none text-sm w-full"></select>
          </div>
        </div>
        <div class="flex justify-center">
          <button class="icon w-10 h-10 rounded-xl bg-blue-500 text-white flex items-center justify-center hover:bg-blue-600 transition text-xl">
            <i class='bx bx-transfer'></i>
          </button>
        </div>
        <div class="col-span-2 flex flex-col gap-1">
          <label class="text-sm text-gray-500">To</label>
          <div class="to flex items-center bg-gray-50 border border-gray-200 rounded-xl px-3 h-11 gap-2">
            <img id="toFlag" src="https://flagcdn.com/48x36/in.png" class="w-5 h-4 object-cover rounded-sm" />
            <select class="bg-transparent outline-none text-sm w-full"></select>
          </div>
        </div>
      </div>

      <!-- Result -->
      <div class="exchange-rate bg-blue-50 rounded-xl p-4 text-center text-blue-600 font-semibold text-lg">
        Getting exchange rate...
      </div>

      <button class="w-full bg-blue-500 text-white font-semibold py-3 rounded-xl hover:bg-blue-600 transition-colors flex items-center justify-center gap-2">
        <i class='bx bx-refresh'></i> Get Exchange Rate
      </button>
    </div>

  </div>

  <script>
    var country_list = {
      AED:"AE",AFN:"AF",XCD:"AG",ALL:"AL",AMD:"AM",ANG:"AN",AOA:"AO",ARS:"AR",AUD:"AU",AZN:"AZ",
      BAM:"BA",BBD:"BB",BDT:"BD",XOF:"BE",BGN:"BG",BHD:"BH",BIF:"BI",BMD:"BM",BND:"BN",BOB:"BO",
      BRL:"BR",BSD:"BS",NOK:"BV",BWP:"BW",BYR:"BY",BZD:"BZ",CAD:"CA",CDF:"CD",XAF:"CF",CHF:"CH",
      CLP:"CL",CNY:"CN",COP:"CO",CRC:"CR",CUP:"CU",CVE:"CV",CZK:"CZ",DJF:"DJ",DKK:"DK",DOP:"DO",
      DZD:"DZ",EGP:"EG",ETB:"ET",EUR:"FR",FJD:"FJ",FKP:"FK",GBP:"GB",GEL:"GE",GHS:"GH",GIP:"GI",
      GMD:"GM",GNF:"GN",GTQ:"GT",GYD:"GY",HKD:"HK",HNL:"HN",HRK:"HR",HTG:"HT",HUF:"HU",IDR:"ID",
      ILS:"IL",INR:"IN",IQD:"IQ",IRR:"IR",ISK:"IS",JMD:"JM",JOD:"JO",JPY:"JP",KES:"KE",KGS:"KG",
      KHR:"KH",KMF:"KM",KPW:"KP",KRW:"KR",KWD:"KW",KYD:"KY",KZT:"KZ",LAK:"LA",LBP:"LB",LKR:"LK",
      LRD:"LR",LYD:"LY",MAD:"MA",MDL:"MD",MGA:"MG",MKD:"MK",MMK:"MM",MNT:"MN",MUR:"MU",MVR:"MV",
      MWK:"MW",MXN:"MX",MYR:"MY",MZN:"MZ",NAD:"NA",NGN:"NG",NIO:"NI",NPR:"NP",NZD:"NZ",OMR:"OM",
      PAB:"PA",PEN:"PE",PGK:"PG",PHP:"PH",PKR:"PK",PLN:"PL",PYG:"PY",QAR:"QA",RON:"RO",RSD:"RS",
      RUB:"RU",RWF:"RW",SAR:"SA",SBD:"SB",SCR:"SC",SDG:"SD",SEK:"SE",SGD:"SG",SLL:"SL",SOS:"SO",
      SRD:"SR",SYP:"SY",SZL:"SZ",THB:"TH",TJS:"TJ",TMT:"TM",TND:"TN",TRY:"TR",TTD:"TT",TWD:"TW",
      TZS:"TZ",UAH:"UA",UGX:"UG",USD:"US",UYU:"UY",UZS:"UZ",VEF:"VE",VND:"VN",YER:"YE",ZAR:"ZA",ZMK:"ZM"
    };

    var apiKey       = "e759f92560e41c99ee6213a2";
    var dropList     = document.querySelectorAll("form select, .from select, .to select");
    var fromCurrency = document.querySelector(".from select");
    var toCurrency   = document.querySelector(".to select");
    var getButton    = document.querySelector("form button, .bg-blue-500[type!='button']");

    // Populate selects
    var selects = document.querySelectorAll("select");
    for (var s = 0; s < selects.length; s++) {
      var sel = selects[s];
      var isFrom = sel.closest(".from") !== null;
      for (var code in country_list) {
        var opt = document.createElement("option");
        opt.value = code;
        opt.textContent = code;
        if (isFrom && code === "USD") { opt.selected = true; }
        if (!isFrom && code === "PHP") { opt.selected = true; }
        sel.appendChild(opt);
      }
      sel.addEventListener("change", function(e) { loadFlag(e.target); });
    }

    function loadFlag(element) {
      var code = element.value;
      var img  = element.closest(".from, .to").querySelector("img");
      if (img && country_list[code]) {
        img.src = "https://flagcdn.com/48x36/" + country_list[code].toLowerCase() + ".png";
      }
    }

    document.querySelector(".icon").addEventListener("click", function() {
      var temp = fromCurrency.value;
      fromCurrency.value = toCurrency.value;
      toCurrency.value   = temp;
      loadFlag(fromCurrency);
      loadFlag(toCurrency);
      getExchangeRate();
    });

    function getExchangeRate() {
      var amountInput   = document.getElementById("amountInput");
      var exchangeRateTxt = document.querySelector(".exchange-rate");
      var amountVal = amountInput.value || 1;
      amountInput.value = amountVal;
      exchangeRateTxt.textContent = "Getting exchange rate...";

      fetch("https://v6.exchangerate-api.com/v6/" + apiKey + "/latest/" + fromCurrency.value)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var rate  = data.conversion_rates[toCurrency.value];
          var total = (rate * amountVal).toFixed(2);
          exchangeRateTxt.textContent = amountVal + " " + fromCurrency.value + " = " + total + " " + toCurrency.value;
        })
        .catch(function() { exchangeRateTxt.textContent = "Something went wrong. Check your connection."; });
    }

    function setQuick(from, to) {
      fromCurrency.value = from;
      toCurrency.value   = to;
      loadFlag(fromCurrency);
      loadFlag(toCurrency);
      getExchangeRate();
    }

    var btn = document.querySelector(".bg-blue-500.w-full");
    btn.addEventListener("click", function(e) { e.preventDefault(); getExchangeRate(); });

    window.addEventListener("load", getExchangeRate);
  </script>

</body>
</html>
