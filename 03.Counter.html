<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>* { font-family: 'Oswald', sans-serif; }</style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-start p-6 gap-6">

  <div class="w-full max-w-5xl">
    <a href="index.html" class="inline-flex items-center gap-1 text-gray-400 hover:text-blue-500 text-sm transition-colors">
      <i class='bx bx-arrow-back'></i> Back to Index
    </a>
  </div>

  <div class="w-full max-w-5xl">
    <h1 class="text-4xl font-bold text-gray-800">Text Analyzer</h1>
    <p class="text-gray-400 font-light mt-1">Type or paste text to analyze it in real time</p>
  </div>

  <!-- Bento: textarea left-center, stats right column -->
  <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-3 gap-5">

    <!-- Textarea — spans 2 cols -->
    <div class="lg:col-span-2 bg-white rounded-2xl shadow p-5 flex flex-col gap-3">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-edit text-blue-500'></i> Input</h2>
      <textarea id="textInput" placeholder="Type or paste your text here..."
        class="w-full flex-1 min-h-64 p-3 bg-gray-50 border border-gray-200 rounded-xl resize-none focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm text-gray-700"></textarea>
      <button onclick="document.getElementById('textInput').value=''; updateCounts();"
        class="self-end bg-gray-200 text-gray-700 font-semibold px-4 py-2 rounded-xl hover:bg-gray-300 transition-colors text-sm flex items-center gap-2">
        <i class='bx bx-x'></i> Clear
      </button>
    </div>

    <!-- Stats column -->
    <div class="flex flex-col gap-4">

      <div class="bg-blue-500 text-white rounded-2xl shadow p-5 flex flex-col gap-1">
        <i class='bx bx-text text-3xl opacity-70'></i>
        <p id="wordCount" class="text-4xl font-bold">0</p>
        <p class="text-sm font-light opacity-80">Words</p>
      </div>

      <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-1">
        <i class='bx bx-font-size text-2xl text-gray-400'></i>
        <p id="charCount" class="text-3xl font-bold text-gray-800">0</p>
        <p class="text-sm text-gray-400 font-light">Characters (with spaces)</p>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white rounded-2xl shadow p-3 text-center">
          <p id="letterCount" class="text-2xl font-bold text-green-500">0</p>
          <p class="text-xs text-gray-400 font-light mt-1">Letters</p>
        </div>
        <div class="bg-white rounded-2xl shadow p-3 text-center">
          <p id="numberCount" class="text-2xl font-bold text-purple-500">0</p>
          <p class="text-xs text-gray-400 font-light mt-1">Numbers</p>
        </div>
        <div class="bg-white rounded-2xl shadow p-3 text-center">
          <p id="spaceCount" class="text-2xl font-bold text-orange-400">0</p>
          <p class="text-xs text-gray-400 font-light mt-1">Spaces</p>
        </div>
      </div>

    </div>

  </div>

  <!-- Bottom bento: extra stats -->
  <div class="w-full max-w-5xl grid grid-cols-2 sm:grid-cols-4 gap-4">
    <div class="bg-white rounded-2xl shadow p-4 text-center">
      <p id="sentenceCount" class="text-2xl font-bold text-teal-500">0</p>
      <p class="text-sm text-gray-400 font-light mt-1">Sentences</p>
    </div>
    <div class="bg-white rounded-2xl shadow p-4 text-center">
      <p id="paragraphCount" class="text-2xl font-bold text-pink-500">0</p>
      <p class="text-sm text-gray-400 font-light mt-1">Paragraphs</p>
    </div>
    <div class="bg-white rounded-2xl shadow p-4 text-center">
      <p id="avgWordLen" class="text-2xl font-bold text-indigo-500">0</p>
      <p class="text-sm text-gray-400 font-light mt-1">Avg Word Length</p>
    </div>
    <div class="bg-white rounded-2xl shadow p-4 text-center">
      <p id="readTime" class="text-2xl font-bold text-rose-500">0s</p>
      <p class="text-sm text-gray-400 font-light mt-1">Read Time</p>
    </div>
  </div>

  <script>
    var textInput = document.getElementById("textInput");

    function updateCounts() {
      var text = textInput.value;

      var words = text.trim() === "" ? 0 : text.trim().split(/\s+/).length;
      document.getElementById("wordCount").textContent = words;
      document.getElementById("charCount").textContent = text.length;

      var letters = text.match(/[a-zA-Z]/g);
      document.getElementById("letterCount").textContent = letters ? letters.length : 0;

      var nums = text.match(/[0-9]/g);
      document.getElementById("numberCount").textContent = nums ? nums.length : 0;

      var spaces = text.match(/\s/g);
      document.getElementById("spaceCount").textContent = spaces ? spaces.length : 0;

      var sentences = text.trim() === "" ? 0 : (text.match(/[.!?]+/g) || []).length;
      document.getElementById("sentenceCount").textContent = sentences;

      var paragraphs = text.trim() === "" ? 0 : text.trim().split(/\n\s*\n/).length;
      document.getElementById("paragraphCount").textContent = paragraphs;

      var wordArr = text.trim() === "" ? [] : text.trim().split(/\s+/);
      var totalLen = 0;
      for (var i = 0; i < wordArr.length; i++) { totalLen += wordArr[i].length; }
      var avg = wordArr.length > 0 ? (totalLen / wordArr.length).toFixed(1) : 0;
      document.getElementById("avgWordLen").textContent = avg;

      var readSec = Math.ceil(words / 3);
      if (readSec >= 60) {
        document.getElementById("readTime").textContent = Math.ceil(readSec / 60) + "m";
      } else {
        document.getElementById("readTime").textContent = readSec + "s";
      }
    }

    textInput.addEventListener("input", updateCounts);
  </script>

</body>
</html>
