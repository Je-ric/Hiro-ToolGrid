<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direction Indicator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <style>
    * { font-family: 'Oswald', sans-serif; }
    .direction-area { position: absolute; width: 33.33%; height: 33.33%; display: flex; justify-content: center; align-items: center; color: white; font-weight: 600; font-size: 14px; transition: background-color 0.2s; cursor: pointer; letter-spacing: 1px; }
    .direction-area:hover { background-color: #3b82f6; z-index: 10; }
    .direction-area.active { background-color: #2563eb; }
    .nw { top:0; left:0; } .n { top:0; left:33.33%; } .ne { top:0; right:0; }
    .w  { top:33.33%; left:0; } .center { top:33.33%; left:33.33%; background-color:#334155; }
    .e  { top:33.33%; right:0; }
    .sw { bottom:0; left:0; } .s { bottom:0; left:33.33%; } .se { bottom:0; right:0; }
    .compass::before, .compass::after { content:''; position:absolute; background-color:rgba(255,255,255,0.08); }
    .compass::before { width:100%; height:1px; top:33.33%; left:0; box-shadow:0 100px 0 rgba(255,255,255,0.08); }
    .compass::after  { height:100%; width:1px; left:33.33%; top:0; box-shadow:100px 0 0 rgba(255,255,255,0.08); }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-6 gap-6">

  <!-- Back -->
  <div class="w-full max-w-5xl">
    <a href="index.html" class="inline-flex items-center gap-1 text-gray-400 hover:text-blue-500 text-sm transition-colors">
      <i class='bx bx-arrow-back'></i> Back to Index
    </a>
  </div>

  <!-- Page Title -->
  <div class="w-full max-w-5xl">
    <h1 class="text-4xl font-bold text-gray-800">Direction Indicator</h1>
    <p class="text-gray-400 font-light mt-1">Hover or click a zone on the compass to detect direction</p>
  </div>

  <!-- Bento Layout: compass center, info sides -->
  <div class="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-5">

    <!-- Left: Legend -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-4">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-info-circle text-blue-500'></i> Directions</h2>
      <div class="grid grid-cols-3 gap-2 text-center text-sm">
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">NW</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">N</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">NE</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">W</div>
        <div class="bg-blue-500 rounded-lg p-2 font-medium text-white">C</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">E</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">SW</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">S</div>
        <div class="bg-gray-50 rounded-lg p-2 font-medium text-gray-600">SE</div>
      </div>
      <p class="text-xs text-gray-400 font-light">Hover over any zone on the compass to highlight it.</p>
    </div>

    <!-- Center: Compass -->
    <div class="flex flex-col items-center justify-center gap-4">
      <div class="compass relative w-72 h-72 rounded-2xl bg-slate-700 overflow-hidden shadow-xl">
        <div class="direction-area nw" data-direction="NW">NW</div>
        <div class="direction-area n"  data-direction="N">N</div>
        <div class="direction-area ne" data-direction="NE">NE</div>
        <div class="direction-area w"  data-direction="W">W</div>
        <div class="direction-area center" data-direction="C">C</div>
        <div class="direction-area e"  data-direction="E">E</div>
        <div class="direction-area sw" data-direction="SW">SW</div>
        <div class="direction-area s"  data-direction="S">S</div>
        <div class="direction-area se" data-direction="SE">SE</div>
      </div>
    </div>

    <!-- Right: Active display -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-4 justify-between">
      <h2 class="text-lg font-semibold text-gray-700 flex items-center gap-2"><i class='bx bx-compass text-blue-500'></i> Active Zone</h2>

      <div class="flex-1 flex flex-col items-center justify-center gap-3">
        <div id="activeDisplay" class="w-24 h-24 rounded-2xl bg-gray-100 flex items-center justify-center text-4xl font-bold text-gray-300 transition-all">
          —
        </div>
        <p id="activeLabel" class="text-gray-400 text-sm font-light">Hover a zone</p>
      </div>

      <div class="bg-gray-50 rounded-xl p-3 text-sm text-gray-500 font-light">
        <p class="font-medium text-gray-700 mb-1">Last 5 hovered:</p>
        <p id="historyLog" class="text-gray-400 tracking-widest">—</p>
      </div>
    </div>

  </div>

  <script>
    var areas   = document.querySelectorAll('.direction-area');
    var display = document.getElementById('activeDisplay');
    var label   = document.getElementById('activeLabel');
    var history = [];

    var fullNames = {
      N: 'North', S: 'South', E: 'East', W: 'West',
      NE: 'North-East', NW: 'North-West', SE: 'South-East', SW: 'South-West', C: 'Center'
    };

    for (var i = 0; i < areas.length; i++) {
      areas[i].addEventListener('mouseenter', function() {
        var dir = this.getAttribute('data-direction');
        display.textContent = dir;
        display.className = 'w-24 h-24 rounded-2xl bg-blue-500 flex items-center justify-center text-4xl font-bold text-white transition-all';
        label.textContent = fullNames[dir] || dir;

        history.push(dir);
        if (history.length > 5) { history.shift(); }
        document.getElementById('historyLog').textContent = history.join(' · ');
      });

      areas[i].addEventListener('mouseleave', function() {
        display.textContent = '—';
        display.className = 'w-24 h-24 rounded-2xl bg-gray-100 flex items-center justify-center text-4xl font-bold text-gray-300 transition-all';
        label.textContent = 'Hover a zone';
      });
    }
  </script>

</body>
</html>
